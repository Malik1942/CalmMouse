name: Windows

on:
  push:
    paths:
      - "windows/**"
      - "shared/**"
      - "Sources/CalmMouseCore/**"
      - "Tests/CalmMouseCoreTests/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "shared/**"
      - "Sources/CalmMouseCore/**"
      - "Tests/CalmMouseCoreTests/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

jobs:
  # The core logic and its tests are plain net10.0, so they also run on Linux.
  # (While a test project has no tests yet, `dotnet test` with xUnit v3 through VSTest
  # prints "no test is available" and still exits 0, so these jobs pass.)
  core:
    name: Test the core logic (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test windows/tests/CalmMouse.Core.Tests

  win:
    name: Build the app and run all tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build windows/CalmMouse.Windows.sln -c Release

      - name: Test the core logic
        run: dotnet test windows/tests/CalmMouse.Core.Tests -c Release --no-build

      - name: Test the Windows parts
        run: dotnet test windows/tests/CalmMouse.Win.Tests -c Release --no-build

  probe:
    name: Build the Windows test program
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (win-x64, one .exe)
        run: dotnet publish windows/probe -c Release -r win-x64 -o out

      # Runs the whole probe with no input: no mouse, no controller, so it only proves the
      # hook, Raw Input and SDL3 set up and tear down without errors on real Windows.
      - name: Smoke run
        shell: pwsh
        run: |
          $null | ./out/CalmMouseProbe.exe | Out-Null
          $report = Get-ChildItem "$env:USERPROFILE\Desktop", "." -Filter "CalmMouseProbe-report-*.txt" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $report) { throw "no report written" }
          Get-Content $report.FullName -Encoding utf8
          if (Select-String -Path $report.FullName -Pattern "出错|失败" -Quiet) { throw "the probe reported an error" }

      - uses: actions/upload-artifact@v4
        with:
          name: CalmMouseProbe-win-x64
          path: out/CalmMouseProbe.exe
          if-no-files-found: error
